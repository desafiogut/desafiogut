motivo: >-
  O prazo do relâmpago é local (AppContext l.193-195: localStorage ?? agora+1800 s). O servidor já
  publica termino_em por edição + `agora` (GET /edicoes; useEdicoes + offsetRelogioMs). ⚠️ Sozinho NÃO
  fecha a DEBT-016: sem o onClose do 17c, o «NOVA RODADA» reabre o overlay (R-B1). Não desligar o EM BREVE antes do 17c.
