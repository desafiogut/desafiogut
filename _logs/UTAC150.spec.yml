schema: utac/1
name: UTAC150
title: "AAB versionCode 15 com o Regulamento v8.0 e a Edição Especial Palpite"
type: publicacao
baseline: f8e0d71
motivo: >-
  O cliente aprovou o Regulamento v8.0 (só existe em PDF no Desktop). É preciso integrá-lo
  no código, no GUTO e no gate, resolver o DEBT-111 e gerar o AAB versionCode 15 para a Play.
frentes:
