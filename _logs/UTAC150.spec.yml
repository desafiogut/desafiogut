  - id: B
    nome: DEBT-111 — regra dos lances da apuração, textos «+2 pontos», gate legado
    entrega: [conforme as decisões do operador]
  - id: C
    nome: Especial Palpite no Início e em Ofertas Programadas (layout existente)
    entrega: [verificação]
