name: UTAC110k
title: "Dossiê jurídico para o advogado (B-2) — natureza do jogo, quem vende, saldos presos, LGPD"
type: documentacao-juridica
baseline: 26fd0dc
motivo: >-
  O AAB tem um bloqueador jurídico: o modelo (menor lance único com Passe pago) precisa de parecer
  sobre a sua natureza, o vendedor legal tem de estar claro, há valores de clientes presos (R$ 23,75
  em 7 contas + 12 senhas on-chain) e a LGPD tem pontos em aberto (DPO não designado, pseudonimização).
  O advogado não tem hoje um documento de factos organizado por blocos de decisão.
